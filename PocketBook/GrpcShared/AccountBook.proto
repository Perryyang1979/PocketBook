syntax = "proto3";
option csharp_namespace = "GrpcShared";
package PocketBook.AccountBook;

service AccountBook {
  rpc RegisterUser (PocketUserInfo) returns (MessageResponse);
  rpc LoginUser (UserRequest) returns (UserLoginResponse);
  rpc AddTransaction (PocketTransactionInfo) returns (MessageResponse);
  rpc GetDailyTransations(DailyDetailTransationRequest) returns (DailyTransactionResponse);
  rpc GetDailyTransationsStream (DailyDetailTransationRequest) returns (stream PocketTransactionInfo);
  rpc GetDailySummaryStream (UserRequest) returns (stream DailySummary);
  rpc GetMonthlyCategorySummaryStream (UserRequest) returns (stream CategorySummary);
  rpc AddCategory(CategoryInfo) returns(MessageResponse);
  rpc DeleteCategory(CategoryInfo) returns(MessageResponse);
  rpc GetAllCategoryStream (GetCategoryRequest) returns (stream CategoryInfo);
  rpc AddIdentification(IdentificationInfo) returns(MessageResponse);
  rpc DeleteIdentification(IdentificationInfo) returns(MessageResponse);
  rpc GetAllIdentificationStream (GetIdentificationRequest) returns (stream IdentificationInfo);
  rpc ResetPassword (ResetPasswordRequest) returns (MessageResponse);
  rpc ChangePassword (ChangePasswordRequest) returns (MessageResponse);
}

message PocketUserInfo {
  string username = 1;
  string password = 2;
  string email = 3;
  string phoneNumber = 4;
  string groupId = 5;
}

message UserRequest {
  string username = 1;
  string password = 2;
}

message UserLoginResponse {
  bool success = 1;
  string message = 2;
  string usergroupId = 3;
}

message MessageResponse {
  bool success = 1;
  string message = 2;
}

message DailyDetailTransationRequest
{
	string startDate = 1;
	string endDate = 2;
	string usergroupId =3;
}

message PocketTransactionInfo {
  string username = 1;
  double amount = 2;
  bool isIncome = 3;
  string category = 4;
  string comments = 5 ;
  string transactionDate = 6;
  string identification = 7;
  string usergroupId =8;
}

message DailyTransactionResponse {
  repeated PocketTransactionInfo dailyTransactions = 1;
}

message DailySummaryResponse {
  repeated DailySummary dailySummaries = 1;
}

message DailySummary {
  string date = 1;
  double totalIncome = 2;
  double totalExpense = 3;
}

message CategorySummary {
  string date = 1;
  string category = 2;
  double totalExpense = 3;
  double totalIncome = 4;
  string identification = 5;
}

message CategoryInfo{
  bool isIncome = 1;
  string Description =2 ;
  string detail =3;
  string usergroupId =4;
}

message GetCategoryRequest{
	string usergroupId =1;
}


message IdentificationInfo{
  string Description =1 ;
  string usergroupId =2;
}


message GetIdentificationRequest
{
	string usergroupId =2;
}

message ResetPasswordRequest{
	string email = 1;
}

message ChangePasswordRequest{
	string username = 1;
	string oldPassword = 2;
	string newPassword = 3;
}

