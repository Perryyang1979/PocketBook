syntax = "proto3";
option csharp_namespace = "GrpcShared";
package PocketBook.AccountBook;

service AccountBook {
  rpc RegisterUser (PocketUserInfo) returns (UserResponse);
  rpc LoginUser (UserRequest) returns (UserResponse);
  rpc AddTransaction (PocketTransactionInfo) returns (TransactionResponse);
  rpc GetDailyTransations(DailyDetailTransationRequest) returns (DailyTransactionResponse);
  rpc GetDailyTransationsStream (DailyDetailTransationRequest) returns (stream PocketTransactionInfo);
  rpc GetDailySummary (UserRequest) returns (DailySummaryResponse);
  rpc GetCategorySummary (UserRequest) returns (CategorySummaryResponse);
}

message PocketUserInfo {
  string username = 1;
  string password = 2;
  string email = 3;
  string phoneNumber = 4;
}

message UserRequest {
  string username = 1;
  string password = 2;
}

message UserResponse {
  bool success = 1;
  string message = 2;
}

message DailyDetailTransationRequest
{
	string startDate = 1;
	string endDate = 2;
}

message PocketTransactionInfo {
  string username = 1;
  double amount = 2;
  bool isIncome = 3;
  string category = 4;
  string comments = 5 ;
  string transactionDate = 6;
}

message TransactionResponse {
  bool success = 1;
  string message = 2;
}


message DailyTransactionResponse {
  repeated PocketTransactionInfo dailyTransactions = 1;
}

message DailySummaryResponse {
  repeated DailySummary dailySummaries = 1;
}

message DailySummary {
  string date = 1;
  double totalIncome = 2;
  double totalExpense = 3;
}

message CategorySummaryResponse {
  repeated CategorySummary categorySummaries = 1;
}

message CategorySummary {
  string category = 1;
  double totalAmount = 2;
}